<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Medical Insurance Cost Prediction</title>
    <style>
        body {
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: #0e1117;
            color: #e4e6eb;
            margin: 0;
            padding: 0;
        }
        .page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        .card {
            background: #161b22;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
            max-width: 560px;
            width: 100%;
            padding: 2.5rem;
        }
        h1 {
            margin-top: 0;
            margin-bottom: 0.25rem;
            font-size: 1.75rem;
        }
        p.lead {
            margin-top: 0;
            color: #8b949e;
        }
        .form-group {
            margin-bottom: 1.25rem;
        }
        label {
            display: block;
            margin-bottom: 0.35rem;
            font-weight: 600;
        }
        input,
        select {
            width: 100%;
            padding: 0.65rem 0.75rem;
            border: 1px solid #30363d;
            border-radius: 8px;
            background: #0d1117;
            color: #f0f6fc;
        }
        input:focus,
        select:focus {
            outline: none;
            border-color: #58a6ff;
            box-shadow: 0 0 0 2px rgba(88, 166, 255, 0.2);
        }
        .submit-btn {
            width: 100%;
            padding: 0.85rem;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #22d3ee, #3b82f6);
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }
        .submit-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 20px rgba(59, 130, 246, 0.35);
        }
        .result {
            margin-top: 1.75rem;
            padding: 1rem;
            border-radius: 10px;
            background: #0d1117;
            border: 1px solid #30363d;
        }
        .result.error {
            border-color: #f87171;
            color: #fecaca;
        }
    </style>
</head>
<body>
    <div class="page">
        <div class="card">
            <h1>Medical Insurance Cost Prediction</h1>
            <p class="lead">
                Enter patient details to estimate annual insurance charges.
            </p>
            <form action="/predict" method="post">
                <div class="form-group">
                    <label for="age">Age</label>
                    <input id="age" name="age" type="number" min="0" max="120" placeholder="e.g. 29" required />
                </div>
                <div class="form-group">
                    <label for="sex">Sex</label>
                    <select id="sex" name="sex" required>
                        <option value="" disabled selected>Select</option>
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="bmi">BMI</label>
                    <input id="bmi" name="bmi" type="number" step="0.01" min="0" placeholder="e.g. 27.9" required />
                </div>
                <div class="form-group">
                    <label for="children">Children</label>
                    <input id="children" name="children" type="number" min="0" max="10" placeholder="e.g. 2" required />
                </div>
                <div class="form-group">
                    <label for="smoker">Smoker</label>
                    <select id="smoker" name="smoker" required>
                        <option value="" disabled selected>Select</option>
                        <option value="yes">Yes</option>
                        <option value="no">No</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="region">Region</label>
                    <select id="region" name="region" required>
                        <option value="" disabled selected>Select</option>
                        <option value="southwest">Southwest</option>
                        <option value="southeast">Southeast</option>
                        <option value="northwest">Northwest</option>
                        <option value="northeast">Northeast</option>
                    </select>
                </div>
                <button class="submit-btn" type="submit">Estimate Charges</button>
            </form>

            {% if error_message %}
            <div class="result error">
                <strong>Error:</strong> {{ error_message }}
            </div>
            {% elif results is not none %}
            <div class="result">
                <strong>Prediction:</strong> {{ results }}
            </div>
            {% endif %}
        </div>
    </div>
</body>
</html>
