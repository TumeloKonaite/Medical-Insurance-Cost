[project]
name = "medical-insurance-cost-prediction"
version = "0.1.0"
description = "Train and serve a FastAPI model to predict medical insurance costs."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "matplotlib",
    "seaborn",
    "fastapi>=0.128.0",
    "jinja2>=3.1.6",
    "uvicorn>=0.40.0",
    "python-multipart>=0.0.22",
    "httpx>=0.28.1",
    "pydantic>=2.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.14.14",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]
namespaces = false

[tool.ruff]
exclude = ["notebooks", "notebook"]
